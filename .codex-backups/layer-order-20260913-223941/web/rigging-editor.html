<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sprite Lab · 레이어 편집기</title>
<style>
:root{color-scheme:dark;font:14px/1.45 system-ui,sans-serif;background:#090c12;color:#edf0f7}*{box-sizing:border-box}body{margin:0;height:100vh;overflow:hidden}button,input,select{font:inherit}button,select{border:1px solid #3a455d;border-radius:7px;background:#222b3d;color:inherit;padding:8px 11px}button{cursor:pointer}button:hover{background:#303a50}button:disabled,select:disabled{opacity:.42;cursor:default}.primary{background:#7560e3;border-color:#9483ff;font-weight:700}header{height:60px;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:9px 15px;border-bottom:1px solid #293247;background:#141a26}h1,h2,h3,p{margin:0}.title h1{font-size:17px}.title p,.muted{color:#99a7bd}.layout{height:calc(100vh - 60px);display:grid;grid-template-columns:54px minmax(340px,1fr) 292px}.tools{display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px 6px;border-right:1px solid #293247;background:#111722}.tool{width:42px;height:42px;padding:3px;display:grid;place-items:center;line-height:1.05;font-size:11px}.tool strong{font-size:16px}.tool.active{border-color:#9c8aff;background:#443967;box-shadow:inset 3px 0 #b9abff}.workspace{min-width:0;min-height:0;display:grid;grid-template-rows:auto 1fr;background:#080b10}.toolbar{display:flex;align-items:center;gap:7px;padding:8px 10px;border-bottom:1px solid #293247;background:#151b27;flex-wrap:wrap}.toolbar output{min-width:49px;text-align:center;color:#bec8d8}.toolbar .spacer{flex:1}.scroll{overflow:auto;position:relative;min-width:0;min-height:0}.stage{position:relative;margin:30px;background:repeating-conic-gradient(#2b3242 0 25%,#171d29 0 50%) 0/20px 20px;box-shadow:0 18px 65px #000c;flex:none}.stage canvas{position:absolute;inset:0;display:block;max-width:none;max-height:none;touch-action:none}.right{min-height:0;display:flex;flex-direction:column;border-left:1px solid #293247;background:#111722}.panel{padding:12px;border-bottom:1px solid #293247}.panel h2{font-size:14px;margin-bottom:9px}.selected-card{display:grid;gap:5px;padding:10px;border:1px solid #344057;border-radius:8px;background:#171e2b}.selected-name{font-weight:750;color:#d9d2ff;overflow-wrap:anywhere}.selected-meta{font-size:12px;color:#94a3ba;white-space:pre-line;overflow-wrap:anywhere}.range{display:grid;grid-template-columns:1fr auto;gap:4px 8px;margin-top:11px}.range input{grid-column:1/-1;width:100%}.status{margin-top:10px;white-space:pre-wrap;min-height:42px;color:#bec8d8}.downloads{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}.downloads a{color:#c9beff}.layers-panel{min-height:170px;display:flex;flex-direction:column;flex:1;padding:12px 8px 8px}.layers-head{display:flex;justify-content:space-between;align-items:center;padding:0 4px 8px}.layers-head h2{font-size:14px}.layer-list{overflow:auto;display:grid;gap:3px;align-content:start}.layer{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:8px;width:100%;text-align:left;padding:7px 8px;border-color:transparent;background:transparent}.layer:hover{background:#1b2331}.layer.selected{border-color:#8f7df0;background:#393252}.layer input{width:15px;height:15px;margin:0}.layer span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.layer small{display:block;color:#8997ad;overflow:hidden;text-overflow:ellipsis}.keys{padding:9px 12px;border-top:1px solid #293247;color:#94a3ba;font-size:12px}.keys kbd{padding:1px 5px;border:1px solid #465169;border-radius:4px;background:#252d3d;color:#e9edf6}.compare.on{background:#71582b}.spinner{animation:pulse 1s ease-in-out infinite alternate}@keyframes pulse{to{opacity:.45}}.readonly .edit-only{display:none!important}@media(max-width:820px){.layout{grid-template-columns:48px 1fr}.right{position:fixed;right:10px;bottom:10px;width:270px;max-height:62vh;border:1px solid #39445b;border-radius:10px;z-index:4;box-shadow:0 12px 42px #000b}.title p{display:none}.tool{width:38px}.keys{display:none}}
</style></head><body>
<header><div class="title"><h1 id="pageTitle">레이어 편집기</h1><p id="pageDescription">캔버스에서 파츠를 고른 뒤 브러시와 지우개로 정리합니다.</p></div><div><button id="back">돌아가기</button> <button id="save" class="primary edit-only" disabled>PSD와 패키지에 저장</button></div></header>
<main class="layout">
  <nav class="tools" aria-label="도구"><button id="moveTool" class="tool active" title="선택 (V)"><strong>V</strong><span>선택</span></button><button id="brushTool" class="tool edit-only" title="복원 브러시 (B)"><strong>B</strong><span>브러시</span></button><button id="eraserTool" class="tool edit-only" title="지우개 (E)"><strong>E</strong><span>지우개</span></button></nav>
  <section class="workspace"><div class="toolbar"><button id="undo" class="edit-only" disabled>실행 취소</button><button id="redo" class="edit-only" disabled>다시 실행</button><button id="fit">화면 맞춤</button><button id="zoomOut" title="축소">−</button><output id="zoomValue">100%</output><button id="zoomIn" title="확대">＋</button><button id="compare" class="compare edit-only">누르는 동안 저장본</button><span class="spacer"></span><select id="versions" class="edit-only" title="저장된 작업 버전"></select><button id="restoreVersion" class="edit-only" hidden>선택 버전 복원</button><span class="muted" id="revision"></span></div><div id="scroll" class="scroll"><div id="stage" class="stage"><canvas id="canvas"></canvas></div></div></section>
  <aside class="right"><section class="panel"><h2>선택 레이어</h2><div class="selected-card"><div id="selectedName" class="selected-name">캔버스의 파츠를 클릭하세요</div><div id="selectedMeta" class="selected-meta">앞에 보이는 불투명 픽셀을 기준으로 선택합니다.</div></div><div class="range edit-only"><span>브러시 크기</span><output id="sizeValue">34px</output><input id="size" type="range" min="2" max="256" value="34"></div><div class="status" id="status">결과를 불러오는 중…</div><div class="downloads"><a id="psd" hidden>PSD 다운로드</a><a id="package" hidden>V1 패키지</a><a id="packageV2" hidden>V2 패키지</a></div></section><section class="layers-panel"><div class="layers-head"><h2>레이어</h2><span class="muted">위가 앞쪽</span></div><div id="layers" class="layer-list"></div></section><div class="keys"><kbd>V</kbd> 선택　 <kbd>B</kbd> 복원　 <kbd>E</kbd> 지우개　 <kbd>[ ]</kbd> 크기<br><kbd>Ctrl Z</kbd> 취소　 <kbd>Ctrl Shift Z</kbd> 다시　 <kbd>Space</kbd> 이동　 <kbd>Ctrl 휠</kbd> 확대</div></aside>
</main>
<script>
'use strict';
const $=id=>document.getElementById(id),query=new URLSearchParams(location.search),jobId=query.get('job'),shareMatch=location.pathname.match(/^\/share\/rig\/([^/]+)\/inspector\/?$/),shareToken=shareMatch?decodeURIComponent(shareMatch[1]):null;
let model=null,parts=[],selected=null,history=[],redoStack=[],active=null,space=false,panning=null,comparing=false,saving=false,tool='move',readonly=false;
const canvas=$('canvas'),ctx=canvas.getContext('2d',{willReadFrequently:true}),stage=$('stage'),scroll=$('scroll');
if(shareToken){$('pageTitle').textContent='공유 레이어 편집';$('pageDescription').textContent='공유된 결과의 레이어를 선택하고 브러시와 지우개로 함께 수정합니다.'}
async function api(path,body){const options=body===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json','X-Sprite-Request':'1'},body:JSON.stringify(body)};const response=await fetch(path,options);let data={};try{data=await response.json()}catch{}if(response.status===401&&!readonly){location.href='/';throw Error('로그인이 필요합니다.')}if(!response.ok)throw Error(data.error||'요청에 실패했습니다.');return data}
function status(message,error=false){$('status').textContent=message;$('status').style.color=error?'#ffb8bd':''}
function stamp(part,target,kind,x,y,r){if(kind==='erase'){target.save();target.globalCompositeOperation='destination-out';target.fillStyle='#000';target.beginPath();target.arc(x,y,r,0,Math.PI*2);target.fill();target.restore();return}target.save();target.beginPath();target.arc(x,y,r,0,Math.PI*2);target.clip();target.globalCompositeOperation='source-over';target.drawImage(part.generated,0,0);target.restore()}
function applyStroke(part,operation,start=0){const target=part.canvas.getContext('2d'),points=operation.points,size=operation.size;for(let i=start;i<points.length;i++){const point=points[i],x=point.x-part.left,y=point.y-part.top,r=size*(.70+point.p*.60)*.5;if(i>0){const before=points[i-1],px=before.x-part.left,py=before.y-part.top,pr=size*(.70+before.p*.60)*.5,d=Math.hypot(x-px,y-py),steps=Math.max(1,Math.ceil(d/Math.max(1,Math.min(r,pr)*.35)));for(let n=1;n<=steps;n++){const t=n/steps;stamp(part,target,operation.kind,px+(x-px)*t,py+(y-py)*t,pr+(r-pr)*t)}}else stamp(part,target,operation.kind,x,y,r)}}
function render(){if(!model)return;ctx.clearRect(0,0,canvas.width,canvas.height);for(const part of parts){if(part.visible)ctx.drawImage(comparing?part.saved:part.canvas,part.left,part.top)}if(selected&&!comparing){const zoom=currentZoom();ctx.save();ctx.strokeStyle='#5ee6ff';ctx.fillStyle='#10202ddd';ctx.lineWidth=Math.max(1,2/zoom);ctx.setLineDash([7/zoom,4/zoom]);ctx.strokeRect(selected.left+.5,selected.top+.5,selected.width-1,selected.height-1);ctx.setLineDash([]);ctx.font=`${Math.max(10,12/zoom)}px system-ui`;const label=selected.name,w=ctx.measureText(label).width+12/zoom,h=20/zoom,y=Math.max(0,selected.top-h);ctx.fillRect(selected.left,y,w,h);ctx.fillStyle='#dffaff';ctx.fillText(label,selected.left+6/zoom,y+14/zoom);ctx.restore()}}
function rebuild(layerId){const part=parts.find(item=>item.id===layerId);if(!part)return;const target=part.canvas.getContext('2d');target.globalCompositeOperation='source-over';target.clearRect(0,0,part.width,part.height);target.drawImage(part.saved,0,0);for(const operation of history)if(operation.layerId===layerId)applyStroke(part,operation);render()}
function updateVersionAction(){const revision=Number($('versions').value),dirty=history.length>0;$('versions').disabled=saving||dirty;$('restoreVersion').hidden=readonly||!Number.isInteger(revision)||revision===model?.revision;$('restoreVersion').disabled=saving||dirty}
function drawVersions(){const root=$('versions');root.replaceChildren();for(const version of model.versions||[]){const option=document.createElement('option');option.value=version.revision;option.textContent=version.label+(version.current?' · 현재':'');root.append(option)}root.value=String(model.revision);root.hidden=root.options.length<2;updateVersionAction()}
function updateActions(message){const dirty=history.length>0;$('undo').disabled=!dirty||saving;$('redo').disabled=!redoStack.length||saving;$('save').disabled=!dirty||saving;window.onbeforeunload=dirty?()=>true:null;updateVersionAction();if(message)status(message);else if(dirty)status(`${history.length}개 편집 작업 · 저장 전`);else status(readonly?'읽기 전용 · 클릭하면 레이어를 확인할 수 있습니다.':`작업 버전 v${(model?.revision||0)+1} · 저장된 상태`)}
function updateSelection(){if(!selected){$('selectedName').textContent='캔버스의 파츠를 클릭하세요';$('selectedMeta').textContent='앞에 보이는 불투명 픽셀을 기준으로 선택합니다.';return}$('selectedName').textContent=selected.name;$('selectedMeta').textContent=`ID: ${selected.id}\n원본: ${selected.sourceLayerName||selected.name}\n위치 ${selected.left}, ${selected.top} · ${selected.width}×${selected.height}px · ${selected.visible?'표시':'숨김'}`}
function select(part,announce=true){selected=part;drawLayerList();updateSelection();if(announce)status(`“${part.name}” 레이어를 선택했습니다.`);render();requestAnimationFrame(()=>document.querySelector('.layer.selected')?.scrollIntoView({block:'nearest'}))}
function drawLayerList(){const root=$('layers');root.replaceChildren();for(const part of [...parts].reverse()){const row=document.createElement('button');row.className='layer'+(part===selected?' selected':'');row.dataset.layerId=part.id;const check=document.createElement('input');check.type='checkbox';check.checked=part.visible;check.title='레이어 표시/숨김';check.setAttribute('aria-label',part.name+' 표시');check.onclick=event=>{event.stopPropagation();part.visible=check.checked;updateSelection();render()};const label=document.createElement('span');label.textContent=part.name;const meta=document.createElement('small');meta.textContent=`${part.width}×${part.height} · ${part.sourceLayerName||part.id}`;label.append(meta);row.append(check,label);row.onclick=()=>select(part);root.append(row)}}
async function bitmapCanvas(url,width,height){const response=await fetch(url);if(!response.ok)throw Error('레이어 이미지를 불러오지 못했습니다.');const bitmap=await createImageBitmap(await response.blob()),target=document.createElement('canvas');target.width=width;target.height=height;target.getContext('2d').drawImage(bitmap,0,0);bitmap.close();return target}
async function load(){if(!jobId&&!shareToken){status('작업 번호가 없습니다.',true);return}try{const endpoint=shareToken?`/share/rig/${encodeURIComponent(shareToken)}/rig-edit`:`/api/jobs/${encodeURIComponent(jobId)}/rig-edit`;model=await api(endpoint);readonly=Boolean(model.readonly);document.body.classList.toggle('readonly',readonly);canvas.width=model.canvas.width;canvas.height=model.canvas.height;parts=[];status(`레이어 ${model.parts.length}개를 불러오는 중…`);for(const record of model.parts){const suffix=(record.asset.includes('?')?'&':'?')+'v='+model.revision;const originalSuffix=(record.originalAsset.includes('?')?'&':'?')+'v='+model.revision;const [saved,generated]=await Promise.all([bitmapCanvas(record.asset+suffix,record.width,record.height),bitmapCanvas(record.originalAsset+originalSuffix,record.width,record.height)]);const working=document.createElement('canvas');working.width=record.width;working.height=record.height;working.getContext('2d').drawImage(saved,0,0);parts.push({...record,name:record.runtimeName||record.sourceLayerName||record.id,visible:true,saved,generated,canvas:working})}selected=null;history=[];redoStack=[];$('revision').textContent=`작업 버전 v${model.revision+1}${readonly?' · 읽기 전용':''}`;for(const [id,value] of [['psd',model.psd],['package',model.package],['packageV2',model.packageV2]]){$(id).href=value||'#';$(id).hidden=!value}drawVersions();drawLayerList();updateSelection();fit();setTool('move',false);updateActions();render()}catch(error){status(error.message,true)}}
function canvasPoint(event){const rect=canvas.getBoundingClientRect();return{x:(event.clientX-rect.left)*canvas.width/rect.width,y:(event.clientY-rect.top)*canvas.height/rect.height,p:event.pressure>0?event.pressure:.5}}
function hitTest(point){for(let i=parts.length-1;i>=0;i--){const part=parts[i];if(!part.visible)continue;const x=Math.floor(point.x-part.left),y=Math.floor(point.y-part.top);if(x<0||y<0||x>=part.width||y>=part.height)continue;try{if(part.canvas.getContext('2d',{willReadFrequently:true}).getImageData(x,y,1,1).data[3]>=12)return part}catch{}}return null}
function setTool(next,announce=true){if(readonly&&next!=='move')next='move';tool=next;for(const [id,name] of [['moveTool','move'],['brushTool','restore'],['eraserTool','erase']])$(id).classList.toggle('active',name===tool);canvas.style.cursor=space?'grab':tool==='move'?'default':'crosshair';if(announce)status(tool==='move'?'선택 도구: 캔버스의 파츠를 클릭하세요.':tool==='restore'?'복원 브러시: 생성 직후 원본 픽셀을 되살립니다.':'지우개: 선택 레이어에서 문지른 부분을 지웁니다.')}
canvas.onpointerdown=event=>{if(saving)return;if(space||event.button===1){event.preventDefault();panning={x:event.clientX,y:event.clientY,left:scroll.scrollLeft,top:scroll.scrollTop};canvas.setPointerCapture(event.pointerId);canvas.style.cursor='grabbing';return}if(event.button!==0)return;const point=canvasPoint(event);if(tool==='move'||event.altKey||readonly){event.preventDefault();const found=hitTest(point);if(found)select(found);else{selected=null;drawLayerList();updateSelection();status('이 위치에는 보이는 레이어가 없습니다.');render()}return}if(!selected){status('먼저 V를 누르고 수정할 레이어를 선택하세요.',true);return}event.preventDefault();active={kind:tool,layerId:selected.id,size:Number($('size').value),points:[point]};canvas.setPointerCapture(event.pointerId);applyStroke(selected,active);render()};
canvas.onpointermove=event=>{if(panning){scroll.scrollLeft=panning.left-(event.clientX-panning.x);scroll.scrollTop=panning.top-(event.clientY-panning.y);return}if(!active)return;active.points.push(canvasPoint(event));applyStroke(selected,active,active.points.length-1);render()};
function finish(event){if(panning){panning=null;setTool(tool,false)}if(!active)return;history.push(active);active=null;redoStack=[];if(canvas.hasPointerCapture(event.pointerId))canvas.releasePointerCapture(event.pointerId);updateActions()}
canvas.onpointerup=finish;canvas.onpointercancel=finish;
function undo(){if(!history.length)return;const operation=history.pop();redoStack.push(operation);rebuild(operation.layerId);updateActions()}
function redo(){if(!redoStack.length)return;const operation=redoStack.pop();history.push(operation);rebuild(operation.layerId);updateActions()}
$('undo').onclick=undo;$('redo').onclick=redo;$('moveTool').onclick=()=>setTool('move');$('brushTool').onclick=()=>setTool('restore');$('eraserTool').onclick=()=>setTool('erase');
function currentZoom(){return Number($('zoomValue').dataset.value||100)/100}
function setZoom(percent,anchor){percent=Math.max(25,Math.min(400,Math.round(percent/5)*5));const old=currentZoom(),beforeX=anchor?scroll.scrollLeft+anchor.x:0,beforeY=anchor?scroll.scrollTop+anchor.y:0,ratio=percent/(old*100);$('zoomValue').dataset.value=percent;$('zoomValue').textContent=percent+'%';const width=canvas.width*percent/100,height=canvas.height*percent/100;canvas.style.width=width+'px';canvas.style.height=height+'px';stage.style.width=width+'px';stage.style.height=height+'px';if(anchor){scroll.scrollLeft=beforeX*ratio-anchor.x;scroll.scrollTop=beforeY*ratio-anchor.y}render()}
function fit(){if(!model)return;const available=Math.max(160,scroll.clientWidth-60),vertical=Math.max(160,scroll.clientHeight-60),zoom=Math.min(1,available/canvas.width,vertical/canvas.height);setZoom(Math.max(25,Math.floor(zoom*100/5)*5))}
$('fit').onclick=fit;$('zoomOut').onclick=()=>setZoom(currentZoom()*100-10);$('zoomIn').onclick=()=>setZoom(currentZoom()*100+10);$('size').oninput=()=>$('sizeValue').textContent=$('size').value+'px';
scroll.addEventListener('wheel',event=>{if(!event.ctrlKey)return;event.preventDefault();const rect=scroll.getBoundingClientRect();setZoom(currentZoom()*100+(event.deltaY<0?10:-10),{x:event.clientX-rect.left,y:event.clientY-rect.top})},{passive:false});
function compare(value){comparing=value;$('compare').classList.toggle('on',value);render()}
$('compare').onpointerdown=()=>compare(true);for(const name of ['pointerup','pointercancel','pointerleave'])$('compare').addEventListener(name,()=>compare(false));
document.addEventListener('keydown',event=>{if(['INPUT','TEXTAREA','SELECT'].includes(event.target.tagName))return;const key=event.key.toLowerCase();if(event.code==='Space'){space=true;canvas.style.cursor='grab';event.preventDefault()}else if(key==='v')setTool('move');else if(key==='b'&&!readonly)setTool('restore');else if(key==='e'&&!readonly)setTool('erase');else if((event.ctrlKey||event.metaKey)&&key==='z'&&!readonly){event.preventDefault();event.shiftKey?redo():undo()}else if((event.ctrlKey||event.metaKey)&&key==='y'&&!readonly){event.preventDefault();redo()}else if((event.ctrlKey||event.metaKey)&&['+','='].includes(event.key)){event.preventDefault();setZoom(currentZoom()*100+10)}else if((event.ctrlKey||event.metaKey)&&event.key==='-'){event.preventDefault();setZoom(currentZoom()*100-10)}else if((event.ctrlKey||event.metaKey)&&event.key==='0'){event.preventDefault();fit()}else if((event.ctrlKey||event.metaKey)&&event.key==='1'){event.preventDefault();setZoom(100)}else if((event.key==='['||event.key===']')&&!readonly){event.preventDefault();$('size').value=Math.max(2,Math.min(256,Number($('size').value)+(event.key==='['?-4:4)));$('size').oninput()}});
document.addEventListener('keyup',event=>{if(event.code==='Space'){space=false;setTool(tool,false)}});
$('versions').onchange=updateVersionAction;
$('restoreVersion').onclick=async()=>{const target=Number($('versions').value);if(!Number.isInteger(target)||target===model.revision||saving)return;if(!confirm(`작업 버전 v${target+1}을 새 작업 버전으로 복원할까요?\n현재 버전도 기록에 그대로 남습니다.`))return;saving=true;updateActions();status('이전 작업 버전을 새 버전으로 복원하는 중…');try{const endpoint=shareToken?`/share/rig/${encodeURIComponent(shareToken)}/rig-edit/restore`:`/api/jobs/${encodeURIComponent(jobId)}/rig-edit/restore`;const data=await api(endpoint,{revision:model.revision,targetRevision:target});await load();status(`작업 버전 v${data.revision+1}로 복원 완료`)}catch(error){status(error.message,true)}finally{saving=false;updateActions()}};
$('save').onclick=async()=>{if(!history.length||saving||readonly)return;saving=true;updateActions();$('save').classList.add('spinner');status('수정본으로 PSD와 Unity 패키지를 다시 만드는 중…');try{const endpoint=shareToken?`/share/rig/${encodeURIComponent(shareToken)}/rig-edit/revisions`:`/api/jobs/${encodeURIComponent(jobId)}/rig-edit/revisions`;const data=await api(endpoint,{revision:model.revision,operations:history});model.revision=data.revision;await load();status(`작업 버전 v${data.revision+1} 저장 완료`)}catch(error){status(error.message,true)}finally{saving=false;$('save').classList.remove('spinner');updateActions()}};
$('back').onclick=()=>{if(history.length&&!confirm('저장하지 않은 수정이 있습니다. 돌아갈까요?'))return;window.onbeforeunload=null;if(shareToken)history.back();else location.href='/#gallery'};
load();
</script></body></html>
