<style>

<header><div class="title"><h1 id="pageTitle">레이어 편집기</h1><p id="pageDescription">레이어를 정리하고, 사라진 파츠는 업로드 원본에서 되살립니다.</p></div><div><button id="back">돌아가기</button> <button id="save" class="primary edit-only" disabled>PSD와 패키지에 저장</button></div></header>
<main class="layout">
  <nav class="tools" aria-label="도구"><button id="moveTool" class="tool active" title="선택 (V)"><strong>V</strong><span>선택</span></button><button id="brushTool" class="tool edit-only" title="레이어 복원 브러시 (B)"><strong>B</strong><span>복원</span></button><button id="sourceTool" class="tool edit-only" title="원본에서 복원 (R)"><strong>R</strong><span>원본</span></button><button id="eraserTool" class="tool edit-only" title="지우개 (E)"><strong>E</strong><span>지우개</span></button></nav>
  <section class="workspace"><div class="toolbar"><button id="undo" class="edit-only" disabled>실행 취소</button><button id="redo" class="edit-only" disabled>다시 실행</button><button id="fit">화면 맞춤</button><button id="zoomOut" title="축소">−</button><output id="zoomValue">100%</output><button id="zoomIn" title="확대">＋</button><button id="compare" class="compare edit-only">누르는 동안 저장본</button><button id="sourceCompare" class="edit-only">원본 겹치기</button><span class="spacer"></span><select id="versions" class="edit-only" title="저장된 작업 버전"></select><button id="restoreVersion" class="edit-only" hidden>선택 버전 복원</button><span class="muted" id="revision"></span></div><div id="scroll" class="scroll"><div id="stage" class="stage"><canvas id="canvas"></canvas></div></div></section>
  <aside class="right"><section class="panel"><h2>선택 레이어</h2><div class="selected-card"><div id="selectedName" class="selected-name">캔버스의 파츠를 클릭하세요</div><div id="selectedMeta" class="selected-meta">앞에 보이는 불투명 픽셀을 기준으로 선택합니다.</div></div><div id="mergeControls" class="merge-controls edit-only" hidden><select id="mergeTarget" aria-label="병합 대상 레이어"></select><button id="mergeLayer" type="button">레이어 병합</button></div><div class="range edit-only"><span>브러시 크기</span><output id="sizeValue">34px</output><input id="size" type="range" min="2" max="256" value="34"></div><div class="source-controls edit-only"><label>원본 복원 파츠<select id="recoveryType"><option value="hood">후드 · 머리와 몸 사이</option><option value="headwear">모자·머리 장식</option><option value="clothing">옷·코트</option><option value="equipment">무기·장비</option><option value="fixed">고정 파츠</option></select></label><label>원본 겹치기 투명도 <span id="sourceOpacityValue">50%</span><input id="sourceOpacity" type="range" min="10" max="100" value="50"></label><button id="attachSource" type="button">기존 작업에 원본 연결</button><input id="sourceFile" type="file" accept="image/png,image/jpeg,image/webp" hidden></div><div class="status" id="status">결과를 불러오는 중…</div><div class="downloads"><a id="psd" hidden>PSD 다운로드</a><a id="package" hidden>V1 패키지</a><a id="packageV2" hidden>V2 패키지</a></div></section><section class="layers-panel"><div class="layers-head"><h2>레이어</h2><span class="muted">위가 앞쪽</span></div><div id="layers" class="layer-list"></div></section><div class="keys"><kbd>V</kbd> 선택　 <kbd>B</kbd> 레이어 복원　 <kbd>R</kbd> 원본 복원　 <kbd>E</kbd> 지우개<br><kbd>Ctrl Z</kbd> 취소　 <kbd>Space</kbd> 이동　 <kbd>Ctrl 휠</kbd> 확대</div></aside>
</main>
<script>
'use strict';
const $=id=>document.getElementById(id),query=new URLSearchParams(location.search),jobId=query.get('job'),shareMatch=location.pathname.match(/^\/share\/rig\/([^/]+)\/inspector\/?$/),shareToken=shareMatch?decodeURIComponent(shareMatch[1]):null;
let model=null,parts=[],selected=null,history=[],redoStack=[],active=null,space=false,panning=null,comparing=false,saving=false,tool='move',readonly=false,sourceCanvas=null,sourceOverlay=false;
const recoverySpecs={hood:{id:'source_headwear_hood',name:'원본 복원 · 후드',runtimeName:'headwear'},headwear:{id:'source_headwear',name:'원본 복원 · 머리 장식',runtimeName:'headwear'},clothing:{id:'source_topwear',name:'원본 복원 · 옷/코트',runtimeName:'topwear'},equipment:{id:'source_objects',name:'원본 복원 · 장비',runtimeName:'objects'},fixed:{id:'source_preserved',name:'원본 복원 · 고정 파츠',runtimeName:'source preserved'}};
const canvas=$('canvas'),ctx=canvas.getContext('2d',{willReadFrequently:true}),stage=$('stage'),scroll=$('scroll');
if(shareToken){$('pageTitle').textContent='공유 레이어 편집';$('pageDescription').textContent='공유된 결과의 레이어를 선택하고 브러시와 지우개로 함께 수정합니다.'}
async function api(path,body){const options=body===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json','X-Sprite-Request':'1'},body:JSON.stringify(body)};const response=await fetch(path,options);let data={};try{data=await response.json()}catch{}if(response.status===401&&!readonly){location.href='/';throw Error('로그인이 필요합니다.')}if(!response.ok)throw Error(data.error||'요청에 실패했습니다.');return data}
function status(message,error=false){$('status').textContent=message;$('status').style.color=error?'#ffb8bd':''}
function stamp(part,target,kind,x,y,r){if(kind==='erase'){target.save();target.globalCompositeOperation='destination-out';target.fillStyle='#000';target.beginPath();target.arc(x,y,r,0,Math.PI*2);target.fill();target.restore();return}target.save();target.beginPath();target.arc(x,y,r,0,Math.PI*2);target.clip();target.globalCompositeOperation='source-over';target.drawImage(kind==='source_restore'?sourceCanvas:part.generated,-part.left,-part.top);target.restore()}
function applyStroke(part,operation,start=0){const target=part.canvas.getContext('2d'),points=operation.points,size=operation.size;for(let i=start;i<points.length;i++){const point=points[i],x=point.x-part.left,y=point.y-part.top,r=size*(.70+point.p*.60)*.5;if(i>0){const before=points[i-1],px=before.x-part.left,py=before.y-part.top,pr=size*(.70+before.p*.60)*.5,d=Math.hypot(x-px,y-py),steps=Math.max(1,Math.ceil(d/Math.max(1,Math.min(r,pr)*.35)));for(let n=1;n<=steps;n++){const t=n/steps;stamp(part,target,operation.kind,px+(x-px)*t,py+(y-py)*t,pr+(r-pr)*t)}}else stamp(part,target,operation.kind,x,y,r)}}
function render(){if(!model)return;ctx.clearRect(0,0,canvas.width,canvas.height);for(const part of parts){if(part.visible)ctx.drawImage(comparing?part.saved:part.canvas,part.left,part.top)}if(sourceOverlay&&sourceCanvas&&!comparing){ctx.save();ctx.globalAlpha=Number($('sourceOpacity').value)/100;ctx.drawImage(sourceCanvas,0,0);ctx.restore()}if(selected&&!comparing){const zoom=currentZoom();ctx.save();ctx.strokeStyle='#5ee6ff';ctx.fillStyle='#10202ddd';ctx.lineWidth=Math.max(1,2/zoom);ctx.setLineDash([7/zoom,4/zoom]);ctx.strokeRect(selected.left+.5,selected.top+.5,selected.width-1,selected.height-1);ctx.setLineDash([]);ctx.font=`${Math.max(10,12/zoom)}px system-ui`;const label=selected.name,w=ctx.measureText(label).width+12/zoom,h=20/zoom,y=Math.max(0,selected.top-h);ctx.fillRect(selected.left,y,w,h);ctx.fillStyle='#dffaff';ctx.fillText(label,selected.left+6/zoom,y+14/zoom);ctx.restore()}}
function rebuild(layerKey){const part=parts.find(item=>item.key===layerKey);if(!part)return;const target=part.canvas.getContext('2d');target.globalCompositeOperation='source-over';target.clearRect(0,0,part.width,part.height);target.drawImage(part.saved,0,0);for(const operation of history)if(operation.kind!=='reorder'&&operation.layerKey===layerKey)applyStroke(part,operation);render()}
function updateVersionAction(){const revision=Number($('versions').value),dirty=history.length>0;$('versions').disabled=saving||dirty;$('restoreVersion').hidden=readonly||!Number.isInteger(revision)||revision===model?.revision;$('restoreVersion').disabled=saving||dirty}
function drawVersions(){const root=$('versions');root.replaceChildren();for(const version of model.versions||[]){const option=document.createElement('option');option.value=version.revision;option.textContent=version.label+(version.current?' · 현재':'');root.append(option)}root.value=String(model.revision);root.hidden=root.options.length<2;updateVersionAction()}
function updateActions(message){const dirty=history.length>0;$('undo').disabled=!dirty||saving;$('redo').disabled=!redoStack.length||saving;$('save').disabled=!dirty||saving;window.onbeforeunload=dirty?()=>true:null;updateVersionAction();if(message)status(message);else if(dirty)status(`${history.length}개 편집 작업 · 저장 전`);else status(readonly?'읽기 전용 · 클릭하면 레이어를 확인할 수 있습니다.':`작업 버전 v${(model?.revision||0)+1} · 저장된 상태`)}
function updateSelection(){if(!selected){$('selectedName').textContent='캔버스의 파츠를 클릭하세요';$('selectedMeta').textContent='앞에 보이는 불투명 픽셀을 기준으로 선택합니다.';updateMergeControls();return}$('selectedName').textContent=selected.name;$('selectedMeta').textContent=`ID: ${selected.id}\n원본: ${selected.sourceLayerName||selected.name}\n위치 ${selected.left}, ${selected.top} · ${selected.width}×${selected.height}px · ${selected.visible?'표시':'숨김'}`;updateMergeControls()}
function select(part,announce=true){selected=part;drawLayerList();updateSelection();if(announce)status(`“${part.name}” 레이어를 선택했습니다.`);render();requestAnimationFrame(()=>document.querySelector('.layer.selected')?.scrollIntoView({block:'nearest'}))}
function applyOrder(order){const byKey=new Map(parts.map(item=>[item.key,item]));parts=order.map(key=>byKey.get(key)).filter(Boolean);drawLayerList();render()}
function cloneCanvas(source){const copy=document.createElement('canvas');copy.width=source.width;copy.height=source.height;copy.getContext('2d').drawImage(source,0,0);return copy}
function updateMergeControls(){const controls=$('mergeControls'),source=selected?.sourceRecovered&&!readonly?selected:null;controls.hidden=!source;if(!source)return;const target=$('mergeTarget'),candidates=parts.filter(item=>item.kind==='part'&&!item.sourceRecovered&&item!==source).sort((a,b)=>Number(b.runtimeName===source.runtimeName)-Number(a.runtimeName===source.runtimeName));target.replaceChildren(...candidates.map(item=>{const option=document.createElement('option');option.value=item.key;option.textContent=(item.runtimeName===source.runtimeName?'추천 · ':'')+item.name;return option}));$('mergeLayer').disabled=!candidates.length}
function mergedCanvas(source,target){const full=document.createElement('canvas');full.width=canvas.width;full.height=canvas.height;const context=full.getContext('2d',{willReadFrequently:true});context.drawImage(target.canvas,target.left,target.top);context.drawImage(source.canvas,source.left,source.top);const pixels=context.getImageData(0,0,full.width,full.height).data;let left=full.width,top=full.height,right=-1,bottom=-1;for(let y=0;y<full.height;y++)for(let x=0;x<full.width;x++)if(pixels[(y*full.width+x)*4+3]){left=Math.min(left,x);top=Math.min(top,y);right=Math.max(right,x);bottom=Math.max(bottom,y)}if(right<left)throw Error('병합할 픽셀이 없습니다.');const cropped=document.createElement('canvas');cropped.width=right-left+1;cropped.height=bottom-top+1;cropped.getContext('2d').drawImage(full,-left,-top);return{canvas:cropped,left,top}}
function applyMerge(operation,record=true){const source=parts.find(item=>item.key===operation.sourceLayerKey),target=parts.find(item=>item.key===operation.targetLayerKey);if(!source||!target)throw Error('병합할 레이어를 찾을 수 없습니다.');if(!operation.before)operation.before={order:parts.map(item=>item.key),source,sourceIndex:parts.indexOf(source),selectedKey:selected?.key,target:{left:target.left,top:target.top,width:target.width,height:target.height,canvas:cloneCanvas(target.canvas)}};const merged=mergedCanvas(source,target);target.left=merged.left;target.top=merged.top;target.width=merged.canvas.width;target.height=merged.canvas.height;target.canvas=merged.canvas;parts=parts.filter(item=>item!==source);selected=target;if(record){history.push(operation);redoStack=[]}drawLayerList();updateSelection();render();updateActions(`“${source.name}”을 “${target.name}”에 병합했습니다. 저장하면 복원 레이어가 제거됩니다.`)}
$('mergeLayer').onclick=()=>{if(!selected?.sourceRecovered||saving)return;const target=parts.find(item=>item.key===$('mergeTarget').value);if(!target)return;if(!confirm(`“${selected.name}”을 “${target.name}”에 병합할까요?\n복원 픽셀은 대상 위에 합쳐지고, 저장 전에는 Ctrl+Z로 취소할 수 있습니다.`))return;try{applyMerge({kind:'merge',sourceLayerKey:selected.key,targetLayerKey:target.key})}catch(error){status(error.message,true)}};
function reorder(fromKey,toKey,before=true){const beforeOrder=parts.map(item=>item.key),from=parts.findIndex(item=>item.key===fromKey);if(from<0||fromKey===toKey)return;const [item]=parts.splice(from,1);const target=parts.findIndex(candidate=>candidate.key===toKey);parts.splice(target+(before?0:1),0,item);history.push({kind:'reorder',before:beforeOrder,after:parts.map(candidate=>candidate.key)});redoStack=[];drawLayerList();render();updateActions('레이어 순서를 변경했습니다. 저장하면 PSD와 Unity 패키지에도 반영됩니다.')}
function moveLayer(part,delta){const index=parts.indexOf(part),target=index+delta;if(target<0||target>=parts.length)return;reorder(part.key,parts[target].key,delta<0)}
function drawLayerList(){const root=$('layers');root.replaceChildren();for(const part of [...parts].reverse()){const row=document.createElement('div');row.className='layer'+(part===selected?' selected':'');row.dataset.layerKey=part.key;row.draggable=!readonly;row.tabIndex=0;row.setAttribute('role','button');const check=document.createElement('input');check.type='checkbox';check.checked=part.visible;check.title='레이어 표시/숨김';check.setAttribute('aria-label',part.name+' 표시');check.onclick=event=>{event.stopPropagation();part.visible=check.checked;updateSelection();render()};const label=document.createElement('span');label.textContent=part.name;const meta=document.createElement('small');meta.textContent=`${part.kind==='expression'?'표정 · ':''}${part.width}×${part.height} · ${part.sourceLayerName||part.id}`;label.append(meta);const controls=document.createElement('span');controls.className='order-buttons edit-only';for(const [text,delta,title] of [['▲',1,'앞으로'],['▼',-1,'뒤로']]){const button=document.createElement('button');button.type='button';button.textContent=text;button.title=title;button.onclick=event=>{event.stopPropagation();moveLayer(part,delta)};controls.append(button)}row.append(check,label,controls);row.onclick=()=>select(part);row.ondragstart=event=>{event.dataTransfer.setData('text/plain',part.key);row.classList.add('dragging')};row.ondragend=()=>row.classList.remove('dragging');row.ondragover=event=>{event.preventDefault();row.classList.add('drop-before')};row.ondragleave=()=>row.classList.remove('drop-before');row.ondrop=event=>{event.preventDefault();row.classList.remove('drop-before');const key=event.dataTransfer.getData('text/plain');if(key!==part.key)reorder(key,part.key,false)};root.append(row)}}
async function bitmapCanvas(url,width,height){const response=await fetch(url);if(!response.ok)throw Error('레이어 이미지를 불러오지 못했습니다.');const bitmap=await createImageBitmap(await response.blob()),target=document.createElement('canvas');target.width=width;target.height=height;target.getContext('2d').drawImage(bitmap,0,0);bitmap.close();return target}
async function load(){if(!jobId&&!shareToken){status('작업 번호가 없습니다.',true);return}try{const endpoint=shareToken?`/share/rig/${encodeURIComponent(shareToken)}/rig-edit`:`/api/jobs/${encodeURIComponent(jobId)}/rig-edit`;model=await api(endpoint);readonly=Boolean(model.readonly);document.body.classList.toggle('readonly',readonly);canvas.width=model.canvas.width;canvas.height=model.canvas.height;parts=[];sourceCanvas=model.sourceReference?await bitmapCanvas(model.sourceReference+'?v='+model.revision,canvas.width,canvas.height):null;sourceOverlay=false;$('sourceCompare').classList.remove('source-on');$('sourceCompare').disabled=!sourceCanvas;$('sourceTool').disabled=!sourceCanvas;$('attachSource').hidden=Boolean(sourceCanvas);const records=model.layers||model.parts;status(`레이어 ${records.length}개를 불러오는 중…`);for(const record of records){const suffix=(record.asset.includes('?')?'&':'?')+'v='+model.revision;const originalSuffix=(record.originalAsset.includes('?')?'&':'?')+'v='+model.revision;const [saved,generated]=await Promise.all([bitmapCanvas(record.asset+suffix,record.width,record.height),bitmapCanvas(record.originalAsset+originalSuffix,record.width,record.height)]);const working=document.createElement('canvas');working.width=record.width;working.height=record.height;working.getContext('2d').drawImage(saved,0,0);parts.push({...record,key:record.key||'part:'+record.id,kind:record.kind||'part',name:record.sourceLayerName||record.runtimeName||record.id,visible:record.defaultVisible!==false,saved,generated,canvas:working})}selected=null;history=[];redoStack=[];$('revision').textContent=`작업 버전 v${model.revision+1}${readonly?' · 읽기 전용':''}`;for(const [id,value] of [['psd',model.psd],['package',model.package],['packageV2',model.packageV2]]){$(id).href=value||'#';$(id).hidden=!value}drawVersions();drawLayerList();updateSelection();fit();setTool('move',false);updateActions();render()}catch(error){status(error.message,true)}}
function ensureRecovery(type){const spec=recoverySpecs[type],key='part:'+spec.id;let part=parts.find(item=>item.key===key);if(part)return part;const blank=()=>{const item=document.createElement('canvas');item.width=canvas.width;item.height=canvas.height;return item};part={id:spec.id,key,kind:'part',name:spec.name,runtimeName:spec.runtimeName,sourceLayerName:spec.name,sourceRecovered:true,recoveryType:type,left:0,top:0,width:canvas.width,height:canvas.height,visible:true,saved:blank(),generated:blank(),canvas:blank(),virtual:true};parts.push(part);drawLayerList();return part}
function canvasPoint(event){const rect=canvas.getBoundingClientRect();return{x:(event.clientX-rect.left)*canvas.width/rect.width,y:(event.clientY-rect.top)*canvas.height/rect.height,p:event.pressure>0?event.pressure:.5}}
function hitTest(point){for(let i=parts.length-1;i>=0;i--){const part=parts[i];if(!part.visible)continue;const x=Math.floor(point.x-part.left),y=Math.floor(point.y-part.top);if(x<0||y<0||x>=part.width||y>=part.height)continue;try{if(part.canvas.getContext('2d',{willReadFrequently:true}).getImageData(x,y,1,1).data[3]>=12)return part}catch{}}return null}
function setTool(next,announce=true){if(readonly&&next!=='move')next='move';if(next==='source_restore'&&!sourceCanvas){status('보관된 원본이 없습니다. 먼저 기존 작업에 원본을 연결하세요.',true);next='move'}tool=next;for(const [id,name] of [['moveTool','move'],['brushTool','restore'],['sourceTool','source_restore'],['eraserTool','erase']])$(id).classList.toggle('active',name===tool);canvas.style.cursor=space?'grab':tool==='move'?'default':'crosshair';if(announce)status(tool==='move'?'선택 도구: 캔버스의 파츠를 클릭하세요.':tool==='restore'?'레이어 복원: 생성 직후의 해당 레이어를 되살립니다.':tool==='source_restore'?'원본 복원: 사라진 파츠를 업로드 원본에서 새 레이어로 칠합니다.':'지우개: 선택 레이어에서 문지른 부분을 지웁니다.')}
canvas.onpointerdown=event=>{if(saving)return;if(space||event.button===1){event.preventDefault();panning={x:event.clientX,y:event.clientY,left:scroll.scrollLeft,top:scroll.scrollTop};canvas.setPointerCapture(event.pointerId);canvas.style.cursor='grabbing';return}if(event.button!==0)return;const point=canvasPoint(event);if(tool==='move'||event.altKey||readonly){event.preventDefault();const found=hitTest(point);if(found)select(found);else{selected=null;drawLayerList();updateSelection();status('이 위치에는 보이는 레이어가 없습니다.');render()}return}if(history.some(item=>item.kind==='merge')){status('레이어 병합 뒤에는 먼저 저장하거나 Ctrl+Z로 병합을 취소하세요.',true);return}if(tool==='source_restore'){selected=ensureRecovery($('recoveryType').value);select(selected,false)}else if(!selected){status('먼저 V를 누르고 수정할 레이어를 선택하세요.',true);return}event.preventDefault();active={kind:tool,layerKey:selected.key,recoveryType:tool==='source_restore'?$('recoveryType').value:undefined,size:Number($('size').value),points:[point]};canvas.setPointerCapture(event.pointerId);applyStroke(selected,active);render()};
canvas.onpointermove=event=>{if(panning){scroll.scrollLeft=panning.left-(event.clientX-panning.x);scroll.scrollTop=panning.top-(event.clientY-panning.y);return}if(!active)return;active.points.push(canvasPoint(event));applyStroke(selected,active,active.points.length-1);render()};
function finish(event){if(panning){panning=null;setTool(tool,false)}if(!active)return;history.push(active);active=null;redoStack=[];if(canvas.hasPointerCapture(event.pointerId))canvas.releasePointerCapture(event.pointerId);updateActions()}
canvas.onpointerup=finish;canvas.onpointercancel=finish;
function undo(){if(!history.length)return;const operation=history.pop();redoStack.push(operation);if(operation.kind==='reorder')applyOrder(operation.before);else if(operation.kind==='merge'){const before=operation.before,target=parts.find(item=>item.key===operation.targetLayerKey);target.left=before.target.left;target.top=before.target.top;target.width=before.target.width;target.height=before.target.height;target.canvas=cloneCanvas(before.target.canvas);parts.splice(Math.min(before.sourceIndex,parts.length),0,before.source);applyOrder(before.order);selected=parts.find(item=>item.key===before.selectedKey)||before.source;drawLayerList();updateSelection();render()}else{rebuild(operation.layerKey);const part=parts.find(item=>item.key===operation.layerKey);if(part?.virtual&&!history.some(item=>item.layerKey===operation.layerKey)){parts=parts.filter(item=>item!==part);if(selected===part)selected=null;drawLayerList();updateSelection();render()}}updateActions()}
function redo(){if(!redoStack.length)return;const operation=redoStack.pop();if(operation.kind==='source_restore'&&!parts.some(item=>item.key===operation.layerKey))ensureRecovery(operation.recoveryType);if(operation.kind==='merge'){applyMerge(operation,false);history.push(operation)}else{history.push(operation);if(operation.kind==='reorder')applyOrder(operation.after);else rebuild(operation.layerKey)}updateActions()}
$('undo').onclick=undo;$('redo').onclick=redo;$('moveTool').onclick=()=>setTool('move');$('brushTool').onclick=()=>setTool('restore');$('sourceTool').onclick=()=>setTool('source_restore');$('eraserTool').onclick=()=>setTool('erase');
function currentZoom(){return Number($('zoomValue').dataset.value||100)/100}
function setZoom(percent,anchor){percent=Math.max(25,Math.min(400,Math.round(percent/5)*5));const old=currentZoom(),beforeX=anchor?scroll.scrollLeft+anchor.x:0,beforeY=anchor?scroll.scrollTop+anchor.y:0,ratio=percent/(old*100);$('zoomValue').dataset.value=percent;$('zoomValue').textContent=percent+'%';const width=canvas.width*percent/100,height=canvas.height*percent/100;canvas.style.width=width+'px';canvas.style.height=height+'px';stage.style.width=width+'px';stage.style.height=height+'px';if(anchor){scroll.scrollLeft=beforeX*ratio-anchor.x;scroll.scrollTop=beforeY*ratio-anchor.y}render()}
function fit(){if(!model)return;const available=Math.max(160,scroll.clientWidth-60),vertical=Math.max(160,scroll.clientHeight-60),zoom=Math.min(1,available/canvas.width,vertical/canvas.height);setZoom(Math.max(25,Math.floor(zoom*100/5)*5))}
$('fit').onclick=fit;$('zoomOut').onclick=()=>setZoom(currentZoom()*100-10);$('zoomIn').onclick=()=>setZoom(currentZoom()*100+10);$('size').oninput=()=>$('sizeValue').textContent=$('size').value+'px';
$('sourceCompare').onclick=()=>{if(!sourceCanvas)return;sourceOverlay=!sourceOverlay;$('sourceCompare').classList.toggle('source-on',sourceOverlay);render()};$('sourceOpacity').oninput=()=>{$('sourceOpacityValue').textContent=$('sourceOpacity').value+'%';render()};$('recoveryType').onchange=()=>{if(tool==='source_restore')status('원본 복원 파츠를 변경했습니다. 다음 선부터 새 레이어에 들어갑니다.')};
$('attachSource').onclick=()=>$('sourceFile').click();$('sourceFile').onchange=()=>{const file=$('sourceFile').files[0];if(!file)return;if(file.size>30*1024*1024){status('원본 이미지는 30MB 이하여야 합니다.',true);return}const reader=new FileReader();reader.onload=async()=>{saving=true;updateActions();status('원본 이미지를 작업에 연결하는 중…');try{const endpoint=shareToken?`/share/rig/${encodeURIComponent(shareToken)}/source`:`/api/jobs/${encodeURIComponent(jobId)}/rig-edit/source`;await api(endpoint,{imageData:reader.result});await load();status('원본을 연결했습니다. R 도구로 사라진 부분을 칠하세요.')}catch(error){status(error.message,true)}finally{saving=false;updateActions()}};reader.readAsDataURL(file)};
scroll.addEventListener('wheel',event=>{if(!event.ctrlKey)return;event.preventDefault();const rect=scroll.getBoundingClientRect();setZoom(currentZoom()*100+(event.deltaY<0?10:-10),{x:event.clientX-rect.left,y:event.clientY-rect.top})},{passive:false});
function compare(value){comparing=value;$('compare').classList.toggle('on',value);render()}
$('compare').onpointerdown=()=>compare(true);for(const name of ['pointerup','pointercancel','pointerleave'])$('compare').addEventListener(name,()=>compare(false));
document.addEventListener('keydown',event=>{if(['INPUT','TEXTAREA','SELECT'].includes(event.target.tagName))return;const key=event.key.toLowerCase();if(event.code==='Space'){space=true;canvas.style.cursor='grab';event.preventDefault()}else if(key==='v')setTool('move');else if(key==='b'&&!readonly)setTool('restore');else if(key==='r'&&!readonly)setTool('source_restore');else if(key==='e'&&!readonly)setTool('erase');else if((event.ctrlKey||event.metaKey)&&key==='z'&&!readonly){event.preventDefault();event.shiftKey?redo():undo()}else if((event.ctrlKey||event.metaKey)&&key==='y'&&!readonly){event.preventDefault();redo()}else if((event.ctrlKey||event.metaKey)&&['+','='].includes(event.key)){event.preventDefault();setZoom(currentZoom()*100+10)}else if((event.ctrlKey||event.metaKey)&&event.key==='-'){event.preventDefault();setZoom(currentZoom()*100-10)}else if((event.ctrlKey||event.metaKey)&&event.key==='0'){event.preventDefault();fit()}else if((event.ctrlKey||event.metaKey)&&event.key==='1'){event.preventDefault();setZoom(100)}else if((event.key==='['||event.key===']')&&!readonly){event.preventDefault();$('size').value=Math.max(2,Math.min(256,Number($('size').value)+(event.key==='['?-4:4)));$('size').oninput()}});
document.addEventListener('keyup',event=>{if(event.code==='Space'){space=false;setTool(tool,false)}});
$('versions').onchange=updateVersionAction;
$('restoreVersion').onclick=async()=>{const target=Number($('versions').value);if(!Number.isInteger(target)||target===model.revision||saving)return;if(!confirm(`작업 버전 v${target+1}을 새 작업 버전으로 복원할까요?\n현재 버전도 기록에 그대로 남습니다.`))return;saving=true;updateActions();status('이전 작업 버전을 새 버전으로 복원하는 중…');try{const endpoint=shareToken?`/share/rig/${encodeURIComponent(shareToken)}/rig-edit/restore`:`/api/jobs/${encodeURIComponent(jobId)}/rig-edit/restore`;const data=await api(endpoint,{revision:model.revision,targetRevision:target});await load();status(`작업 버전 v${data.revision+1}로 복원 완료`)}catch(error){status(error.message,true)}finally{saving=false;updateActions()}};
$('save').onclick=async()=>{if(!history.length||saving||readonly)return;saving=true;updateActions();$('save').classList.add('spinner');status('수정본으로 PSD와 Unity 패키지를 다시 만드는 중…');try{const endpoint=shareToken?`/share/rig/${encodeURIComponent(shareToken)}/rig-edit/revisions`:`/api/jobs/${encodeURIComponent(jobId)}/rig-edit/revisions`;const operations=history.filter(item=>item.kind!=='reorder').map(item=>item.kind==='merge'?{kind:'merge',sourceLayerKey:item.sourceLayerKey,targetLayerKey:item.targetLayerKey}:item);const data=await api(endpoint,{revision:model.revision,operations,layerOrder:parts.map(item=>item.key)});model.revision=data.revision;await load();status(`작업 버전 v${data.revision+1} 저장 완료`)}catch(error){status(error.message,true)}finally{saving=false;$('save').classList.remove('spinner');updateActions()}};
$('back').onclick=()=>{if(history.length&&!confirm('저장하지 않은 수정이 있습니다. 돌아갈까요?'))return;window.onbeforeunload=null;if(shareToken)history.back();else location.href='/#gallery'};
load();
</script></body></html>
