<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MiniMax H3 Sprite Motion Tool</title>
  <style>
    :root { color-scheme: dark; --bg:#0b0d12; --panel:#141821; --line:#2a3140; --text:#f1f3f7; --muted:#949db0; --accent:#8b7cff; --ok:#59d49b; --warn:#ffca63; }
    * { box-sizing:border-box } body { margin:0; min-height:100vh; background:radial-gradient(circle at 20% 0,#20203c 0,transparent 38%),var(--bg); color:var(--text); font:15px/1.5 system-ui,sans-serif }
    main { width:min(1120px,calc(100% - 32px)); margin:36px auto 80px }
    h1 { font-size:clamp(28px,4vw,46px); margin:0 0 6px; letter-spacing:-.04em } .sub { color:var(--muted); margin:0 0 28px }
    .grid { display:grid; grid-template-columns:1fr 1fr; gap:18px } .panel { background:color-mix(in srgb,var(--panel) 94%,transparent); border:1px solid var(--line); border-radius:18px; padding:20px; box-shadow:0 18px 60px #0005 }
    label { display:block; font-weight:700; margin:15px 0 7px } textarea,input,select,button { font:inherit } textarea,input,select { width:100%; color:var(--text); background:#0d1118; border:1px solid var(--line); border-radius:10px; padding:11px 12px } textarea { min-height:110px; resize:vertical }
    .drop { display:grid; place-items:center; min-height:290px; border:1px dashed #515a70; border-radius:14px; overflow:hidden; cursor:pointer; background:#0d1118; color:var(--muted); text-align:center; padding:16px } .drop img { max-width:100%; max-height:360px; object-fit:contain }
    .row { display:grid; grid-template-columns:repeat(3,1fr); gap:10px } button { width:100%; border:0; border-radius:12px; padding:14px; margin-top:18px; background:linear-gradient(135deg,#7365ff,#a46cff); color:white; font-weight:800; cursor:pointer } button:disabled { opacity:.45; cursor:not-allowed }
    .status { display:flex; gap:10px; align-items:center; padding:11px 13px; border:1px solid var(--line); border-radius:11px; margin-bottom:14px; color:var(--muted) } .dot { width:9px; height:9px; border-radius:50%; background:var(--warn); box-shadow:0 0 14px currentColor } .ready .dot { background:var(--ok) }
    .result { display:none; margin-top:18px } .result video,.result img { width:100%; border-radius:12px; background:#090b10; border:1px solid var(--line) } .links { display:flex; gap:10px; margin-top:10px } a { color:#b8afff }
    .notice { font-size:13px; color:var(--muted); margin-top:12px } code { color:#d6d0ff }
    .option { display:flex; gap:9px; align-items:center; font-weight:600; margin-top:14px } .option input { width:auto }
    @media(max-width:800px){.grid{grid-template-columns:1fr}.row{grid-template-columns:1fr}}
  </style>
</head>
<body><main>
  <h1>Sprite Motion Lab</h1>
  <p class="sub">기준 이미지 한 장에서 원하는 캐릭터 동작 영상과 게임용 스프라이트 시트를 만듭니다.</p>
  <div id="status" class="status"><span class="dot"></span><span>환경 확인 중...</span></div>
  <div class="grid">
    <section class="panel">
      <input id="file" type="file" accept="image/png,image/jpeg,image/webp" hidden>
      <div id="drop" class="drop">이미지를 클릭하거나 여기로 끌어오세요<br>전신·고정 구도 이미지 권장</div>
    </section>
    <section class="panel">
      <label for="action">애니메이션 종류</label>
      <select id="action">
        <option value="idle" selected>Idle · 대기</option><option value="walk">Walk · 걷기</option>
        <option value="run">Run · 달리기</option><option value="attack">Attack · 공격</option>
        <option value="cast">Cast · 스킬/마법</option><option value="hit">Hit · 피격</option>
        <option value="death">Death · 사망</option><option value="jump">Jump · 점프</option>
        <option value="custom">Custom · 직접 입력</option>
      </select>
      <label for="facing">캐릭터 방향 고정</label>
      <select id="facing">
        <option value="preserve" selected>입력 이미지 방향 그대로</option>
        <option value="right">화면 오른쪽을 계속 봄 →</option>
        <option value="left">← 화면 왼쪽을 계속 봄</option>
        <option value="front">정면을 계속 봄</option>
        <option value="back">후면을 계속 봄</option>
      </select>
      <label for="prompt">동작 설명</label>
      <textarea id="prompt">gentle breathing, subtle blinking, slight hair and clothing sway, feet remain planted</textarea>
      <div class="row">
        <div><label for="duration">길이</label><select id="duration"><option value="3">3초</option><option value="5" selected>5초</option></select></div>
        <div><label for="size">해상도</label><select id="size">
          <option value="auto_original" selected>원본 비율 · 원본급 (최대 1MP, 느림)</option>
          <option value="auto_quality">원본 비율 · 고화질 (약 0.6MP)</option>
          <option value="auto_safe">원본 비율 · 표준 (약 0.45MP)</option>
          <option value="auto_fast">원본 비율 · 빠른 테스트 (약 0.25MP)</option>
          <option value="352x608">직접 지정 · 352×608</option><option value="480x864">직접 지정 · 480×864</option>
          <option value="608x352">직접 지정 · 608×352</option><option value="864x480">직접 지정 · 864×480</option>
          <option value="608x608">직접 지정 · 608×608</option><option value="768x768">직접 지정 · 768×768</option>
        </select><p id="resolution" class="notice">이미지를 넣으면 실제 크기를 계산합니다.</p></div>
        <div><label for="frames">시트 프레임</label><select id="frames"><option>6</option><option selected>8</option><option>12</option></select></div>
      </div>
      <label class="option"><input id="loop" type="checkbox" checked> 처음과 끝이 이어지는 루프 동작</label>
      <label class="option"><input id="stabilize" type="checkbox" checked> 캐릭터 크기·프레이밍 자동 정규화</label>
      <label for="seed">Seed (비우면 무작위)</label><input id="seed" type="number" min="0" placeholder="random">
      <button id="generate" disabled>5초 Idle 만들기</button>
      <p id="message" class="notice">모델 준비 상태를 확인하고 있습니다.</p>
      <div id="result" class="result">
        <h3>생성 영상</h3><video id="video" controls loop muted></video>
        <h3>스프라이트 시트</h3><img id="sheet" alt="sprite sheet">
        <div class="links"><a id="videoLink" download>정규화 영상</a><a id="rawLink" download>H3 원본</a><a id="sheetLink" download>시트 저장</a></div>
      </div>
    </section>
  </div>
</main>
<script>
const $=id=>document.getElementById(id); let imageData='', filename='reference.png', sourceWidth=0, sourceHeight=0;
const presets={idle:'gentle breathing, subtle blinking, slight hair and clothing sway, feet remain planted',walk:'walk cycle in place, alternating steps, natural arm swing, consistent rhythm',run:'run cycle in place, energetic alternating strides and arm swing',attack:'one clear weapon attack, readable anticipation, strike and follow-through',cast:'one clear magic casting action, hands gather energy and release it forward',hit:'brief impact reaction, recoil backward and regain balance',death:'lose balance and fall into a clearly readable defeated pose',jump:'crouch, jump upward and land back in the starting position',custom:''};
const actionNames={idle:'Idle',walk:'Walk',run:'Run',attack:'Attack',cast:'Cast',hit:'Hit',death:'Death',jump:'Jump',custom:'Custom'};
function updateButtonText(){$('generate').textContent=`${$('duration').value}초 ${actionNames[$('action').value]} 만들기`}
function calculatedSize(){const mode=$('size').value;if(mode.includes('x'))return mode.split('x').map(Number);if(!sourceWidth||!sourceHeight)return[608,608];const budgets={auto_fast:250000,auto_safe:450000,auto_quality:600000,auto_original:1000000};let scale=Math.sqrt(budgets[mode]/(sourceWidth*sourceHeight));if(mode==='auto_original')scale=Math.min(1,scale);let width=Math.max(256,Math.round(sourceWidth*scale/32)*32);let height=Math.max(256,Math.round(sourceHeight*scale/32)*32);return[width,height]}
function updateResolution(){if(!sourceWidth){$('resolution').textContent='이미지를 넣으면 실제 크기를 계산합니다.';return}const [width,height]=calculatedSize();$('resolution').textContent=`원본 ${sourceWidth}×${sourceHeight} → 생성 ${width}×${height} · 비율 유지 전처리`}
function setImage(file){if(!file)return; filename=file.name; const r=new FileReader();r.onload=()=>{imageData=r.result;$('drop').innerHTML=`<img src="${imageData}" alt="reference">`;const probe=new Image();probe.onload=()=>{sourceWidth=probe.naturalWidth;sourceHeight=probe.naturalHeight;updateResolution()};probe.src=imageData;refreshButton()};r.readAsDataURL(file)}
$('drop').onclick=()=>$('file').click(); $('file').onchange=e=>setImage(e.target.files[0]);
$('drop').ondragover=e=>e.preventDefault(); $('drop').ondrop=e=>{e.preventDefault();setImage(e.dataTransfer.files[0])};
let ready=false; function refreshButton(){$('generate').disabled=!(ready&&imageData)}
async function check(){const s=await fetch('/api/status').then(r=>r.json());ready=s.comfy&&s.modelsReady&&s.licenseConfirmed;$('status').className='status '+(ready?'ready':'');let text=s.comfy?'ComfyUI 연결됨':'ComfyUI 연결 안 됨';if(!s.licenseConfirmed)text+=' · MiniMax 별도 라이선스 확인 필요';else if(!s.modelsReady)text+=' · 모델 다운로드 필요';else text+=' · H3 모델 준비 완료';$('status').querySelector('span:last-child').textContent=text;$('message').textContent=ready?'이미지를 넣고 생성을 시작하세요.':'승인 후 download_h3_models.bat을 실행하세요.';refreshButton()}
$('generate').onclick=async()=>{const [width,height]=calculatedSize();$('generate').disabled=true;$('result').style.display='none';$('message').textContent='작업 등록 중...';const body={imageData,filename,animationType:$('action').value,facing:$('facing').value,prompt:$('prompt').value,loop:$('loop').checked,duration:Number($('duration').value),width,height,frameCount:Number($('frames').value),seed:$('seed').value,stabilize:$('stabilize').checked};const r=await fetch('/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const data=await r.json();if(!r.ok){$('message').textContent=data.error;refreshButton();return}poll(data.jobId)};
$('duration').onchange=updateButtonText;
$('size').onchange=updateResolution;
$('action').onchange=()=>{const action=$('action').value;$('prompt').value=presets[action];$('loop').checked=['idle','walk','run','jump'].includes(action);updateButtonText()};
async function poll(id){const j=await fetch('/api/jobs/'+id).then(r=>r.json());$('message').textContent=j.message||j.state;if(j.state==='complete'){$('video').src=j.video;$('video').loop=j.loop;$('sheet').src=j.spriteSheet;$('videoLink').href=j.video;$('rawLink').href=j.rawVideo;$('sheetLink').href=j.spriteSheet;$('result').style.display='block';refreshButton();return}if(j.state==='error'){refreshButton();return}setTimeout(()=>poll(id),3000)}
check();setInterval(check,15000);
</script></body></html>
